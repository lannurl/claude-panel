<!--
  Офис агентов для «чёлки»: настоящая 3D-сцена (three.js), из которой снимаются готовые кадры.
  Панель только раскладывает кадры на холсте tkinter — процессор почти не тратится.
  Запуск: node tools/office3d/render.mjs  (безголовый Edge открывает страницу и забирает картинки).
  Мир: метры, x вправо, y вверх, z к зрителю. Камера ортографическая, общая для всех кадров.
-->

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ───────────────────────── Параметры ─────────────────────────
const Q = new URLSearchParams(location.search);
// Офис больше окна чёлки: панель показывает часть, мышью двигают, колесом отдаляют.
const PPM = +(Q.get('ppm') || 55);   // логических точек на метр в панели (масштаб 1:1)
const BACK_SCALE = 2;          // фон — вдвое крупнее логического размера
const SPRITE_SCALE = 1.5;      // клодики и мебель — в 1.5 раза (панель уменьшает под свой масштаб)
const YAW = THREE.MathUtils.degToRad(+(Q.get('yaw') || 14));
const PITCH = THREE.MathUtils.degToRad(+(Q.get('pitch') || 33));
const ONLY = Q.get('only');    // для проверки: снять одного
const ROOM = { W: 20, D: 12, H: 3.0 };
// Планировка (метры). Вдоль окон — стеклянные кабинеты, впереди — опенспейс островками, переговорная, лаунж.
const CORR_Z = 5.2, CAB_Z = 4.4;                 // коридор и стеклянный фасад кабинетов
const CABS = [{ id: 'A', x0: 4.0, x1: 8.4, door: 6.5, carpet: '#9aa8c8' }, { id: 'B', x0: 8.4, x1: 12.8, door: 10.5, carpet: '#a6c2ae' },
  { id: 'boss', x0: 12.8, x1: 18.0, door: 13.5 }];
const WINDOWS = [[4.5, 7.9], [8.9, 12.3], [13.4, 16.6]];
const MEET = { x0: 0, x1: 5.0, z0: 7.6, door: 4.5, table: { x: 2.4, z: 9.8 } };
const DOOR = { x: 0.3, z: 6.3 };
const TV = { x: 17.6, z: 6.1, y: 1.15 };
const SOFA = { x: 17.6, z: 8.6 };
const CLOCK = { x: 3.4, y: 2.35, z: 0.04, r: 0.16 };
const DESKS = [
  { id: 'boss', x: 15.8, z: 2.3, kind: 'boss' },
  { id: 'A1', x: 5.0, z: 1.9 }, { id: 'A2', x: 7.4, z: 1.9 }, { id: 'A3', x: 5.0, z: 3.7 }, { id: 'A4', x: 7.4, z: 3.7 },
  { id: 'B1', x: 9.4, z: 1.9 }, { id: 'B2', x: 11.8, z: 1.9 }, { id: 'B3', x: 9.4, z: 3.7 }, { id: 'B4', x: 11.8, z: 3.7 },
  { id: 'O1', x: 7.0, z: 7.6 }, { id: 'O2', x: 8.25, z: 7.6 }, { id: 'O3', x: 11.2, z: 7.2 }, { id: 'O4', x: 12.45, z: 7.2 },
  { id: 'O5', x: 7.6, z: 10.4 }, { id: 'O6', x: 8.85, z: 10.4 }, { id: 'O7', x: 11.8, z: 10.2 }, { id: 'O8', x: 13.05, z: 10.2 },
];
// Дорожки: по ним ходят (все отрезки вдоль осей — хватает четырёх направлений кадров)
const LANES = [
  [[0.3, CORR_Z], [15.4, CORR_Z]],
  [[6.5, CORR_Z], [6.5, 0.75]], [[4.6, 0.75], [7.9, 0.75]], [[4.6, 2.55], [7.9, 2.55]],
  [[10.5, CORR_Z], [10.5, 0.75]], [[9.0, 0.75], [12.3, 0.75]], [[9.0, 2.55], [12.3, 2.55]],
  [[13.5, CORR_Z], [13.5, 1.0]], [[13.5, 1.0], [16.8, 1.0]],
  [[4.5, CORR_Z], [4.5, 11.4]], [[0.9, 8.3], [4.5, 8.3]], [[0.9, 11.4], [4.5, 11.4]],
  [[6.0, CORR_Z], [6.0, 8.9]], [[9.7, CORR_Z], [9.7, 8.9]], [[14.3, CORR_Z], [14.3, 8.9]], [[6.0, 8.9], [14.3, 8.9]],
  [[15.4, CORR_Z], [15.4, 7.4]], [[15.4, 7.4], [19.3, 7.4]],
];
// Места занятий: (x, z) — где стоит/сидит; (ax, az) — точка на дорожке, откуда к месту идут по прямой
const SPOTS = {
  coffee: [{ x: 1.55, z: 1.0, ax: 1.55, az: CORR_Z, dir: 'N' }],
  chat: [{ x: 0.95, z: 3.4, ax: 0.95, az: CORR_Z, dir: 'E' }, { x: 1.85, z: 3.4, ax: 1.85, az: CORR_Z, dir: 'W' }],
  bar: [{ x: 2.6, z: 3.05, ax: 2.6, az: CORR_Z, dir: 'S' }],
  window: [5.8, 7.0, 10.0, 11.2].map((x) => ({ x, z: 0.75, ax: x, az: 0.75, dir: 'N' })),
  sofa: [16.95, 17.6, 18.25].map((x) => ({ x, z: SOFA.z - 0.17, ax: x, az: 7.4, dir: 'N' })),
  meetS: [1.4, 2.4, 3.4].map((x) => ({ x, z: 9.0, ax: x, az: 8.3, dir: 'S' })),
  meetN: [1.4, 2.4, 3.4].map((x) => ({ x, z: 10.6, ax: x, az: 11.4, dir: 'N' })),
  phone: [[19.0, 7.4], [3.2, CORR_Z], [14.3, 8.4], [9.7, 6.4]].map(([x, z]) => ({ x, z, ax: x, az: z, dir: 'S' })),
  door: [{ x: DOOR.x, z: DOOR.z, ax: DOOR.x, az: CORR_Z, dir: 'W' }],
};

const log = (t) => { document.getElementById('log').textContent = t; };

// ───────────────────────── Рендерер ─────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camDir = new THREE.Vector3(Math.sin(YAW) * Math.cos(PITCH), Math.sin(PITCH), Math.cos(YAW) * Math.cos(PITCH)).normalize();
function makeCam(target, viewW, viewH) {
  const cam = new THREE.OrthographicCamera(-viewW / 2, viewW / 2, viewH / 2, -viewH / 2, 0.1, 200);
  cam.position.copy(target).addScaledVector(camDir, 60);
  cam.up.set(0, 1, 0); cam.lookAt(target);
  cam.updateMatrixWorld(); cam.updateProjectionMatrix();
  return cam;
}
function toPx(cam, p, w, h) { const v = p.clone().project(cam); return [(v.x + 1) / 2 * w, (1 - v.y) / 2 * h]; }

// ───────────────────────── Материалы и текстуры ─────────────────────────
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0, envMapIntensity: 0.6, ...o });
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
function rnd(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

const woodFloor = canvasTex(1024, 1024, (g, w, h) => {
  const r = rnd(7); const ph = h / 16;
  for (let i = 0; i < 16; i++) {
    let x = -r() * 400;
    while (x < w) {
      const len = 260 + r() * 340; g.fillStyle = `hsl(${27 + r() * 6},${36 + r() * 10}%,${44 + r() * 12}%)`; g.fillRect(x, i * ph, len, ph);
      for (let k = 0; k < 14; k++) { g.strokeStyle = `rgba(60,35,15,${0.05 + r() * 0.07})`; g.beginPath(); const yy = i * ph + r() * ph; g.moveTo(x, yy); g.bezierCurveTo(x + len * .3, yy + r() * 6 - 3, x + len * .7, yy + r() * 6 - 3, x + len, yy); g.stroke(); }
      g.fillStyle = 'rgba(40,22,8,.55)'; g.fillRect(x, i * ph, 2, ph); x += len;
    }
    g.fillStyle = 'rgba(40,22,8,.45)'; g.fillRect(0, i * ph, w, 2);
  }
}, [4, 2]);
const carpetTex = canvasTex(256, 256, (g, w, h) => {      // светлая основа: цвет задаёт материал
  g.fillStyle = '#d4d4d4'; g.fillRect(0, 0, w, h); const r = rnd(3);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(${r() < .5 ? '255,255,255' : '0,0,0'},${r() * .06})`; g.fillRect(r() * w, r() * h, 1.5, 1.5); }
  g.strokeStyle = 'rgba(255,255,255,.05)'; for (let i = 0; i < w; i += 32) { g.strokeRect(i, i, 32, 32); }
}, [10, 5]);
const tileTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#b9b4aa'; g.fillRect(0, 0, w, h); const r = rnd(11);
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) { g.fillStyle = `hsl(40,8%,${80 + r() * 6}%)`; g.fillRect(x * 64 + 1, y * 64 + 1, 62, 62); }
}, [5, 10]);
const rugTex = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#7a3b2e'; g.fillRect(0, 0, w, h); g.strokeStyle = '#e6c58f'; g.lineWidth = 10; g.strokeRect(18, 18, w - 36, h - 36);
  g.lineWidth = 3; g.strokeRect(40, 40, w - 80, h - 80); g.fillStyle = '#1f3a4f';
  for (let i = 0; i < 6; i++) { g.beginPath(); g.ellipse(w / 2, h / 2, 160 - i * 24, 70 - i * 10, 0, 0, 7); g.globalAlpha = .25; g.fill(); }
  g.globalAlpha = 1; const r = rnd(5); for (let i = 0; i < 5000; i++) { g.fillStyle = `rgba(0,0,0,${r() * .08})`; g.fillRect(r() * w, r() * h, 2, 2); }
});
const wallTex = canvasTex(512, 256, (g, w, h) => { g.fillStyle = '#e9e4da'; g.fillRect(0, 0, w, h); const r = rnd(9); for (let i = 0; i < 6000; i++) { g.fillStyle = `rgba(0,0,0,${r() * .025})`; g.fillRect(r() * w, r() * h, 2, 2); } }, [6, 2]);
const brickTex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#6b6a66'; g.fillRect(0, 0, w, h); const r = rnd(21);
  for (let y = 0; y < 16; y++) for (let x = -1; x < 8; x++) { const ox = (y % 2) * 32; g.fillStyle = `hsl(${12 + r() * 10},${30 + r() * 15}%,${36 + r() * 12}%)`; g.fillRect(x * 64 + ox + 2, y * 32 + 2, 60, 28); } }, [2, 2]);
const plaidTex = (a, b) => canvasTex(128, 128, (g, w, h) => { g.fillStyle = a; g.fillRect(0, 0, w, h); g.fillStyle = b; g.globalAlpha = .55; g.fillRect(0, 40, w, 24); g.fillRect(40, 0, 24, h); g.globalAlpha = .3; g.fillRect(0, 100, w, 8); g.fillRect(100, 0, 8, h); }, [3, 3]);

function skyline(night) {
  return canvasTex(2048, 512, (g, w, h) => {
    const sky = g.createLinearGradient(0, 0, 0, h);
    if (night) { sky.addColorStop(0, '#060a1c'); sky.addColorStop(.6, '#141c3c'); sky.addColorStop(1, '#2a2440'); }
    else { sky.addColorStop(0, '#6fa6dc'); sky.addColorStop(.65, '#b9d6ee'); sky.addColorStop(1, '#e9eef0'); }
    g.fillStyle = sky; g.fillRect(0, 0, w, h); const r = rnd(night ? 77 : 78);
    if (night) for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(255,255,255,${r() * .7})`; g.fillRect(r() * w, r() * h * .45, 1.5, 1.5); }
    else for (let i = 0; i < 7; i++) { const cx = r() * w, cy = 40 + r() * 120; g.fillStyle = 'rgba(255,255,255,.75)'; for (let k = 0; k < 6; k++) { g.beginPath(); g.ellipse(cx + k * 26, cy + r() * 10, 50 + r() * 30, 18 + r() * 8, 0, 0, 7); g.fill(); } }
    for (let layer = 0; layer < 3; layer++) {
      let x = 0; const base = h * (0.62 + layer * 0.1);
      while (x < w) {
        const bw = 40 + r() * 110 - layer * 10, bh = (90 + r() * 230) * (1 - layer * 0.25), tone = night ? 14 + layer * 6 : 58 + layer * 9;
        g.fillStyle = night ? `hsl(230,25%,${tone}%)` : `hsl(210,${12 + layer * 6}%,${tone}%)`; g.fillRect(x, base - bh, bw, bh + h);
        if (night || layer === 2) for (let wy = base - bh + 10; wy < base - 4; wy += 12) for (let wx = x + 6; wx < x + bw - 6; wx += 10)
          if (r() < (night ? 0.42 : 0.15)) { g.fillStyle = night ? `rgba(255,${200 + r() * 40},${120 + r() * 60},${.5 + r() * .5})` : 'rgba(180,210,235,.7)'; g.fillRect(wx, wy, 5, 6); }
        if (r() < .12) { g.fillStyle = night ? '#ff3b3b' : '#999'; g.fillRect(x + bw / 2, base - bh - 18, 2, 18); }
        x += bw + r() * 8;
      }
    }
  });
}

// игра на телевизоре: своя гонка по ночному приморскому городу (без чужих логотипов)
function gameFrame(i) {
  return canvasTex(512, 288, (g, w, h) => {
    const sky = g.createLinearGradient(0, 0, 0, h * .6); sky.addColorStop(0, '#2b1055'); sky.addColorStop(.55, '#d53a9d'); sky.addColorStop(1, '#ffb36b');
    g.fillStyle = sky; g.fillRect(0, 0, w, h); g.fillStyle = '#ffd27a'; g.beginPath(); g.arc(w * .5, h * .5, 46, Math.PI, 0); g.fill();
    const r = rnd(4); let x = -((i * 18) % 60);
    while (x < w) { const bw = 20 + r() * 40, bh = 30 + r() * 70; g.fillStyle = '#3a1450'; g.fillRect(x, h * .55 - bh, bw, bh); for (let k = 0; k < 6; k++) { g.fillStyle = 'rgba(255,220,140,.8)'; g.fillRect(x + 4 + r() * (bw - 8), h * .55 - bh + 6 + r() * (bh - 10), 3, 3); } x += bw + 4; }
    g.fillStyle = '#1a0a26'; g.fillRect(0, h * .55, w, h);
    g.fillStyle = '#3b2a4e'; g.beginPath(); g.moveTo(w * .47, h * .55); g.lineTo(w * .53, h * .55); g.lineTo(w * .95, h); g.lineTo(w * .05, h); g.fill();
    g.strokeStyle = '#ffe28a'; g.lineWidth = 4;
    for (let k = 0; k < 6; k++) { const t = ((k / 6) + i * .08) % 1, y0 = h * .55 + (h * .45) * t * t, y1 = y0 + 4 + 20 * t * t; g.beginPath(); g.moveTo(w / 2, y0); g.lineTo(w / 2, y1); g.stroke(); }
    for (const side of [-1, 1]) for (let k = 0; k < 3; k++) {
      const t = ((k / 3) + i * .08) % 1, px = w / 2 + side * (30 + 260 * t * t), py = h * .55 + h * .45 * t * t, s = .3 + 1.6 * t * t;
      g.strokeStyle = '#140820'; g.lineWidth = 3 * s; g.beginPath(); g.moveTo(px, py); g.lineTo(px + side * 4 * s, py - 60 * s); g.stroke();
      g.fillStyle = '#140820'; for (let a = 0; a < 6; a++) { g.beginPath(); g.ellipse(px + side * 4 * s + Math.cos(a) * 14 * s, py - 60 * s + Math.sin(a) * 5 * s, 18 * s, 4 * s, a, 0, 7); g.fill(); }
    }
    const cx = w / 2 + Math.sin(i * 1.3) * 10, cy = h * .83;
    g.fillStyle = 'rgba(0,0,0,.5)'; g.beginPath(); g.ellipse(cx, cy + 26, 70, 10, 0, 0, 7); g.fill();
    g.fillStyle = '#d61f3c'; g.beginPath(); g.roundRect(cx - 62, cy - 10, 124, 36, 10); g.fill();
    g.fillStyle = '#9e1530'; g.beginPath(); g.roundRect(cx - 44, cy - 34, 88, 28, 10); g.fill();
    g.fillStyle = '#2a1b3a'; g.beginPath(); g.roundRect(cx - 36, cy - 30, 72, 18, 6); g.fill();
    g.fillStyle = '#ff4d5e'; g.fillRect(cx - 56, cy, 22, 7); g.fillRect(cx + 34, cy, 22, 7);
    g.fillStyle = '#111'; g.fillRect(cx - 60, cy + 22, 22, 10); g.fillRect(cx + 38, cy + 22, 22, 10);
    g.fillStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.arc(48, h - 46, 34, 0, 7); g.fill();
    g.strokeStyle = '#79e0ff'; g.lineWidth = 2; g.beginPath(); g.arc(48, h - 46, 34, 0, 7); g.stroke();
    g.strokeStyle = '#ccc'; g.lineWidth = 3; g.beginPath(); g.moveTo(30, h - 70); g.lineTo(50, h - 46); g.lineTo(72, h - 30); g.stroke();
    g.fillStyle = '#fff'; g.beginPath(); g.moveTo(48, h - 52); g.lineTo(53, h - 40); g.lineTo(43, h - 40); g.fill();
    g.font = 'bold 22px sans-serif'; g.fillStyle = '#fff'; g.textAlign = 'right'; g.fillText(`${120 + (i * 7) % 40} км/ч`, w - 16, h - 18);
    g.fillStyle = '#7dff9a'; g.fillText('$ ' + (48250 + i * 375).toLocaleString('ru'), w - 16, 30);
  });
}

// ───────────────────────── Мебель ─────────────────────────
const shadowed = (m) => { m.castShadow = m.receiveShadow = true; return m; };
const box = (w, h, d, mat, r = 0.02) => shadowed(new THREE.Mesh(r > 0 ? new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2.01, h / 2.01, d / 2.01)) : new THREE.BoxGeometry(w, h, d), mat));
const cyl = (rt, rb, h, mat, seg = 24, open = false) => shadowed(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), mat));
const sph = (r, mat, sx = 1, sy = 1, sz = 1) => { const m = shadowed(new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), mat)); m.scale.set(sx, sy, sz); return m; };
const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };
const rot = (o, x, y, z) => { o.rotation.set(x, y, z); return o; };

const mat = {
  deskTop: M('#c9a27a', { roughness: .45 }), deskLeg: M('#2b2f36', { metalness: .6, roughness: .35 }),
  monitor: M('#1b1d22', { roughness: .35, metalness: .3 }), plastic: M('#e8e8ea', { roughness: .4 }),
  chair: M('#30343c', { roughness: .6 }), chairMesh: M('#1f2228', { roughness: .8 }), chrome: M('#c9ccd2', { metalness: 1, roughness: .2 }),
  sofa: M('#6b8a9c', { roughness: .9 }), sofaDark: M('#55707f', { roughness: .9 }), wood: M('#8a5a3a', { roughness: .5 }),
  leaf: M('#3f7d3a', { roughness: .7 }), leaf2: M('#5a9a43', { roughness: .7 }), pot: M('#d8cfc2', { roughness: .6 }),
  steel: M('#b8bcc4', { metalness: .9, roughness: .3 }), black: M('#151618', { roughness: .4 }), counter: M('#f2f0ec', { roughness: .3 }),
  cabinet: M('#4b5563', { roughness: .5 }), water: new THREE.MeshPhysicalMaterial({ color: '#9fd4ff', transmission: .6, roughness: .05, thickness: .2, transparent: true, opacity: .8 }),
  paper: M('#f4f1ea'), mugW: M('#f5f5f5', { roughness: .3 }), frame: M('#2c2f36', { metalness: .4, roughness: .4 }),
};

function makeLaptop(on) {   // экраном к клодику (к -z), зрителю видна крышка с оранжевым знаком
  const lap = new THREE.Group();
  lap.add(at(box(0.36, 0.018, 0.25, mat.steel, 0.006), 0, 0.009, 0));
  lap.add(at(box(0.3, 0.004, 0.12, mat.black, 0.001), 0, 0.019, -0.03));
  const lid = new THREE.Group(); lid.position.set(0, 0.018, 0.12); lid.rotation.x = 0.22;
  lid.add(at(box(0.36, 0.24, 0.012, mat.steel, 0.006), 0, 0.12, 0));
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.2), new THREE.MeshStandardMaterial({ color: '#000', emissive: on ? '#9ff0d6' : '#0b0f1c', emissiveIntensity: on ? 1.5 : 1 }));
  scr.rotation.y = Math.PI; scr.position.set(0, 0.12, -0.007); lid.add(scr);
  lid.add(at(new THREE.Mesh(new THREE.CircleGeometry(0.028, 24), new THREE.MeshBasicMaterial({ color: on ? '#ffb38f' : '#b5826b', toneMapped: false })), 0, 0.13, 0.0065));
  if (on) { const glow = new THREE.PointLight('#a8f5e2', 0.7, 1.4, 2); glow.position.set(0, 0.12, -0.25); lid.add(glow); }
  lap.add(lid);
  return lap;
}
function makeDesk({ on = true, deco = 0 } = {}) {
  const g = new THREE.Group();

    for (const s of [-1, 1]) { const c = cyl(0.075, 0.075, 0.05, pm); c.rotation.z = Math.PI / 2; c.position.set(s * (BW / 2 + 0.03), 0.33, 0); body.add(c); } }
  if (ex.phonesNeck) { const pm = M(ex.phonesNeck[0], { roughness: .4 }); const arc = shadowed(new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.02, 8, 24, Math.PI), pm)); arc.rotation.z = Math.PI; arc.position.set(0, 0.29, F + 0.02); body.add(arc);
    for (const s of [-1, 1]) { const c = cyl(0.06, 0.06, 0.04, pm); c.rotation.x = Math.PI / 2; c.position.set(s * 0.2, 0.28, F + 0.03); body.add(c); } }

// Позы. Клодик смотрит в +z; вперёд у ручки/ножки — отрицательный rotation.x.
function resetPose(J) {
  J.body.position.set(0, LEG, 0); J.body.rotation.set(0, 0, 0); J.body.scale.set(1, 1, 1);
  for (const k of ['armL', 'armR']) J[k].rotation.set(0, 0, 0);
  for (const l of J.legs) { l.rotation.set(0, 0, 0); l.position.y = LEG; }
  J.eyes.scale.set(1, 1, 1); J.eyes.position.y = 0.35;
  J.armL.rotation.z = -0.12; J.armR.rotation.z = 0.12;
}
function seat(J, h = 0.5) {     // сидит на стуле/диване: тело на высоте сиденья, ножки вперёд
  const y = h / J.S; J.body.position.y = y;
  for (const l of J.legs) { l.position.y = y; l.rotation.x = -Math.PI / 2 + 0.1; }
}
const P = {
  walk(J, t) {
    const a = Math.sin(t * Math.PI * 2);
    J.legs[0].rotation.x = J.legs[3].rotation.x = a * 0.55; J.legs[1].rotation.x = J.legs[2].rotation.x = -a * 0.55;
    J.body.position.y = LEG + Math.abs(Math.cos(t * Math.PI * 2)) * 0.035; J.body.rotation.z = a * 0.04;
    J.armL.rotation.x = -a * 0.6; J.armR.rotation.x = a * 0.6;
  },
  stand(J, t) { J.body.scale.y = 1 + Math.sin(t * Math.PI * 2) * 0.01; },
  wave(J, t) { J.armR.rotation.z = 2.5 + Math.sin(t * Math.PI * 2) * 0.4; J.body.rotation.z = -0.06; J.body.position.y = LEG + 0.02; },
  type(J, t) {
    seat(J, 0.5); const k = Math.sin(t * Math.PI * 2);
    J.armL.rotation.x = -1.25 + k * 0.12; J.armR.rotation.x = -1.25 - k * 0.12; J.armL.rotation.z = 0.1; J.armR.rotation.z = -0.1;
    J.body.rotation.x = 0.06; J.eyes.position.y = 0.32;
  },
  relax(J, t) {
    seat(J, 0.5); J.body.rotation.x = -0.2 + Math.sin(t * Math.PI * 2) * 0.02;
    J.armL.rotation.z = -2.5; J.armR.rotation.z = 2.5; J.armL.rotation.x = J.armR.rotation.x = 0.35; J.eyes.scale.y = 0.16;
  },

const work = document.createElement('canvas'); const wctx = work.getContext('2d', { willReadFrequently: true });
function shoot(scene, obj, { viewW = 2.6, viewH = 2.6, cy = 0.9, cx = 0 } = {}) {
  scene.add(obj);

  const d = wctx.getImageData(0, 0, w, h).data; let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 4) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) { x0 = y0 = 0; x1 = y1 = 1; }

function pack(items, maxW = 1600) {

  let x = 0, y = 0, rowH = 0, W = 0;
  for (const it of order) { const w = it.color.width, h = it.color.height; if (x + w > maxW) { x = 0; y += rowH + 2; rowH = 0; } it.rect = [x, y, w, h]; x += w + 2; rowH = Math.max(rowH, h); W = Math.max(W, x); }
  const atlas = document.createElement('canvas'); atlas.width = W; atlas.height = y + rowH; const ac = atlas.getContext('2d');

}
